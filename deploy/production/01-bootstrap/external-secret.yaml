apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: myteam-platform-prod-secrets
  namespace: myteam-platform-prod
  labels:
    app.kubernetes.io/part-of: myteam-platform
    environment: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cluster-store
  target:
    name: myteam-platform-prod-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: POSTGRES_DB
      remoteRef:
        key: /myteam-platform/prod/POSTGRES_DB
    - secretKey: POSTGRES_USER
      remoteRef:
        key: /myteam-platform/prod/POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /myteam-platform/prod/POSTGRES_PASSWORD
    - secretKey: DATABASE_URL
      remoteRef:
        key: /myteam-platform/prod/DATABASE_URL
    - secretKey: LOGTO_ISSUER
      remoteRef:
        key: /myteam-platform/prod/LOGTO_ISSUER
    - secretKey: LOGTO_AUDIENCE
      remoteRef:
        key: /myteam-platform/prod/LOGTO_AUDIENCE
