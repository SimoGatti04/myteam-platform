apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-logto
  namespace: myteam-platform-prod
  labels:
    app.kubernetes.io/part-of: myteam-platform
    environment: production
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: myteam-platform-prod-api
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
