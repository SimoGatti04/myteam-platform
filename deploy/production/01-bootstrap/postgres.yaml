apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: myteam-platform-prod-postgres
  namespace: myteam-platform-prod
  labels:
    app.kubernetes.io/name: myteam-platform-prod-postgres
    app.kubernetes.io/component: database
    environment: production
spec:
  serviceName: myteam-platform-prod-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: myteam-platform-prod-postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: myteam-platform-prod-postgres
        app.kubernetes.io/component: database
        environment: production
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: __PRODUCTION_STORAGE_NODE__
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: __PRODUCTION_POSTGRES_IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: myteam-platform-prod-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: myteam-platform-prod-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: myteam-platform-prod-secrets
                  key: POSTGRES_PASSWORD
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: myteam-platform-prod-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: myteam-platform-prod-postgres
  namespace: myteam-platform-prod
  labels:
    app.kubernetes.io/name: myteam-platform-prod-postgres
    app.kubernetes.io/component: database
    environment: production
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: myteam-platform-prod-postgres
    app.kubernetes.io/component: database
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
