apiVersion: v1
kind: PersistentVolume
metadata:
  name: myteam-platform-prod-postgres-data
  labels:
    app.kubernetes.io/name: myteam-platform-prod-postgres
    environment: production
spec:
  capacity:
    storage: __PRODUCTION_STORAGE_CAPACITY__
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: myteam-postgres-prod-local
  local:
    path: /srv/myteam-platform-prod/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - __PRODUCTION_STORAGE_NODE__
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: myteam-platform-prod-postgres-data
  namespace: myteam-platform-prod
  labels:
    app.kubernetes.io/name: myteam-platform-prod-postgres
    environment: production
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: myteam-postgres-prod-local
  resources:
    requests:
      storage: __PRODUCTION_STORAGE_CAPACITY__
