apiVersion: apps/v1
kind: Deployment
metadata:
  name: myteam-platform-web
  namespace: myteam-platform-staging
  labels:
    app.kubernetes.io/name: myteam-platform-web
    app.kubernetes.io/component: frontend
    environment: staging
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: myteam-platform-web
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: myteam-platform-web
        app.kubernetes.io/component: frontend
        environment: staging
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # In nginx:alpine l'utente non-root nginx ha UID 101 e GID 101
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/simogatti04/myteam-platform-web:staging-latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 2
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: myteam-platform-web
  namespace: myteam-platform-staging
  labels:
    app.kubernetes.io/name: myteam-platform-web
    app.kubernetes.io/component: frontend
    environment: staging
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: myteam-platform-web
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
