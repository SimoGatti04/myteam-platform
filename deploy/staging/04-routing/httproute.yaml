apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: myteam-platform-staging
  namespace: myteam-platform-staging
  labels:
    app.kubernetes.io/part-of: myteam-platform
    environment: staging
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
  hostnames:
    - team-staging.simogatti.it
  rules:
    # 1. Rotte API e health liveness verso il backend Fastify
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: Exact
            value: /health
      backendRefs:
        - name: myteam-platform-api
          port: 3000
    # 2. Tutte le altre rotte (SPA frontend) verso Nginx
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: myteam-platform-web
          port: 80
