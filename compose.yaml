services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: myteam
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: myteam_platform
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - myteam-platform-postgres:/var/lib/postgresql/data
      - ./db/init/001-create-test-database.sql:/docker-entrypoint-initdb.d/001-create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myteam -d myteam_platform"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  myteam-platform-postgres:
